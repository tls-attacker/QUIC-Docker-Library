services:
  # BASE IMAGES
  alpine-build-3.24.3:
    image: rub-nds/quic/alpine-build:3.24.3
    build:
      context: ../images/baseimage
      dockerfile: Dockerfile
      args: 
        VERSION: 3.24.3
    deploy:
      replicas: 0
  alpine-build-3.23.3:
    image: rub-nds/quic/alpine-build:3.23.3
    build:
      context: ../images/baseimage
      dockerfile: Dockerfile
      args: 
        VERSION: 3.23.3
    deploy:
      replicas: 0
  alpine-build-3.21.2:
    image: rub-nds/quic/alpine-build:3.21.2
    build:
      context: ../images/baseimage
      dockerfile: Dockerfile
      args: 
        VERSION: 3.21.2
    deploy:
      replicas: 0
  alpine-build-3.19:
    image: rub-nds/quic/alpine-build:3.19
    build:
      context: ../images/baseimage
      dockerfile: Dockerfile
      args: 
        VERSION: 3.19
    deploy:
      replicas: 0
  # QUIC SERVERS
  aioquic-server-1.7.0:
    image: rub-nds/quic/aioquic-server:1.7.0
    build:
      context: ../images
      dockerfile: aioquic/Dockerfile
      target: aioquic-server
      args:
        VERSION: "1.7.0"
    ports:
      - "8000:4433/udp"
      - "9000:8090"
    volumes:
      - ../certs:/certs
      - ../www:/www
    command: --port 4433 -c /certs/server.rsa.crt -k /certs/server.rsa.key
  kwik-server-0.12.1:
    image: rub-nds/quic/kwik-server:0.12.1
    build:
      context: ../images
      dockerfile: kwik/Dockerfile
      target: kwik-server
      args:
        VERSION: "0.12.1"
    ports:
      - "8001:4433/udp"
      - "9001:8090"
    volumes:
      - ../certs:/certs
      - ../www:/www
    command: /certs/server.rsa.crt /certs/server.rsa.key 4433
  lsquic-server-4.11.1:
    image: rub-nds/quic/lsquic-server:4.11.1
    build:
      context: ../images
      dockerfile: lsquic/Dockerfile
      target: lsquic-server
      args:
        VERSION_LSQUIC: "4.11.1"
    ports:
      - "8002:4433/udp"
      - "9002:8090"
    volumes:
      - ../certs:/certs
      - ../www:/www
    command: -s 0.0.0.0:4433 -c localhost,/certs/server.rsa.crt,/certs/server.rsa.key -r /www
  msquic-server-openssl-2.6.3:
    image: rub-nds/quic/msquic-server-openssl:2.6.3
    build:
      context: ../images
      dockerfile: msquic/Dockerfile
      target: msquic-server
      args:
        VERSION: "2.6.3"
        TLS_IMPLEMENTATION: "openssl"
    ports:
      - "8003:4567/udp"
      - "9003:8090"
    volumes:
      - ../certs:/certs
      - ../www:/www
    command: -cert_file:/certs/server.rsa.crt -key_file:/certs/server.rsa.key
    tty: true
  msquic-server-quictls-2.6.3:
    image: rub-nds/quic/msquic-server-quictls:2.6.3

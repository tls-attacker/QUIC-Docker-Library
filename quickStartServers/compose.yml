        TLS_IMPLEMENTATION: "quictls"
    ports:
      - "8004:4567/udp"
      - "9004:8090"
    volumes:
      - ../certs:/certs
      - ../www:/www
    command: -cert_file:/certs/server.rsa.crt -key_file:/certs/server.rsa.key
    tty: true
